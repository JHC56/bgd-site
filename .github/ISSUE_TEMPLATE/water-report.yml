name: Report a problem at the pond
description: Smell, floating trash, odd water color, or anything else you saw at Ingyeongho
title: "[Report] "
labels: ["report"]
body:
  - type: dropdown
    id: site
    attributes:
      label: Where did you see it?
      options:
        - "1. Main gate channel"
        - "2. In front of Hi-Tech Center"
        - "3. Back gate inlet"
        - "4. Center of the pond"
        - "5. In front of Building 5"
        - Not sure / somewhere else
    validations:
      required: true
  - type: checkboxes
    id: kind
    attributes:
      label: What did you see?
      options:
        - label: Bad smell
        - label: Floating trash or debris
        - label: Odd water color (e.g. green)
        - label: Dead fish
        - label: Something else
  - type: input
    id: when
    attributes:
      label: When?
      placeholder: e.g. Nov 6, around 3 PM
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: Drag photos here if you have any.

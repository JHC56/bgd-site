# /report command: a maintainer comments "/report" on a measurement PR, and the bot
#   1) cleans any files in data/inbox/ into data/clean/ (sites, sessions, 1-minute averages),
#   2) checks every clean file,
#   3) writes the reports,
#   4) adds all of it to the same PR (originals move to data/raw/).
# Merging the PR then publishes the data and the reports together.
#
# Safety:
#   - Only the owner, org members and collaborators can trigger it (author_association).
#   - The PR's code is never run. Scripts come from main; only the PR's data files are copied in.
#   - The PR may only add files under data/inbox/ (csv, tsv, txt, json) or data/clean/*.csv.
#   - PRs from forks cannot be pushed to, so the bot opens a copy of the PR with everything added.
name: Report command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  report:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/report') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    concurrency:
      group: report-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Acknowledge the command
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null

      - name: Read the PR
        id: pr
        run: |
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          {
            echo "state=$(jq -r .state /tmp/pr.json)"
            echo "head_ref=$(jq -r .head.ref /tmp/pr.json)"
            echo "head_repo=$(jq -r .head.repo.full_name /tmp/pr.json)"
            echo "base_ref=$(jq -r .base.ref /tmp/pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if the PR is closed
        if: steps.pr.outputs.state != 'open'
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "This PR is closed, so no report was made."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_ref }}
          path: base
          fetch-depth: 0

      - name: Copy in the PR's data files only
        working-directory: base
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          git fetch -q origin "pull/$PR/head:pr-head"
          range="origin/$BASE_REF...pr-head"
          added=$(git diff --name-only --diff-filter=AM "$range")
          others=$(git diff --name-only --diff-filter=DRCTUX "$range")
          clean_re='^data/clean/[0-9]{4}-[0-9]{2}-[0-9]{2}_[A-Za-z0-9]+_[0-9]{4}\.csv$'
          inbox_re='^data/inbox/.+\.(csv|tsv|txt|json)$'
          bad=$( { printf '%s\n' "$others"; printf '%s\n' "$added" | grep -v -E -i "$clean_re|$inbox_re"; printf '%s\n' "$added" | grep -F '..'; } | grep -v '^$' | sort -u || true)
          if [ -n "$bad" ]; then
            msg="This PR may only add files under data/inbox/ (csv, tsv, txt, json) or data/clean/YYYY-MM-DD_SITE_HHMM.csv. Remove these and comment /report again:"
            gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n\n```\n%s\n```' "$msg" "$bad")"
            exit 1
          fi
          if [ -z "$added" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "No data files found in this PR."
            exit 1
          fi
          printf '%s\n' "$added" > /tmp/added.txt
          printf '%s\n' "$added" | grep -E -i "$inbox_re" > /tmp/inbox.txt || true
          while IFS= read -r f; do mkdir -p "$(dirname "$f")"; git show "pr-head:$f" > "$f"; done < /tmp/added.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clean the inbox files
        working-directory: base
        run: |
          if [ ! -s /tmp/inbox.txt ]; then echo "No inbox files"; exit 0; fi
          if ! node scripts/ingest.ts > /tmp/ingest.txt 2>&1; then
            cat /tmp/ingest.txt
            { echo "Some files could not be cleaned. Fix them and comment /report again."; echo; cat .ingest-summary.md; } > /tmp/body.md
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md
            exit 1
          fi
          cat /tmp/ingest.txt

      - name: Check the clean files
        working-directory: base
        run: |
          git -c core.quotepath=false ls-files --others --exclude-standard data/clean | grep -E '\.csv$' > /tmp/clean.txt || true
          if [ ! -s /tmp/clean.txt ]; then
            gh pr comment "$PR" --repo "$REPO" --body "No new clean data came out of this PR."
            exit 1
          fi
          if ! tr '\n' '\0' < /tmp/clean.txt | xargs -0 node scripts/validate.ts > /tmp/validate.txt 2>&1; then
            cat /tmp/validate.txt
            gh pr comment "$PR" --repo "$REPO" --body "$(printf 'The clean CSV check failed. Fix the data and comment /report again.\n\n```\n%s\n```' "$(cat /tmp/validate.txt)")"
            exit 1
          fi
          cat /tmp/validate.txt

      - name: Write the reports
        working-directory: base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          node scripts/report.ts
          { git -c core.quotepath=false ls-files --others --exclude-standard data/clean data/raw reports; git -c core.quotepath=false diff --name-only -- data/clean reports; } | sort -u > /tmp/changed.txt
          echo "Changed files:"; cat /tmp/changed.txt
          { [ -s /tmp/inbox.txt ] && cat .ingest-summary.md && echo; cat .report-pr.md; } > /tmp/summary.md

      # Same-repository PR: add everything to the PR branch itself
      - uses: actions/checkout@v4
        if: steps.pr.outputs.head_repo == github.repository
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          path: pr

      - name: Add the results to this PR
        if: steps.pr.outputs.head_repo == github.repository
        working-directory: pr
        run: |
          while IFS= read -r f; do mkdir -p "$(dirname "$f")"; cp "../base/$f" "$f"; done < /tmp/changed.txt
          while IFS= read -r f; do [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"; done < /tmp/inbox.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clean data/raw reports
          if git diff --cached --quiet; then
            gh pr comment "$PR" --repo "$REPO" --body "Nothing new to add: reports for this data already exist."
            exit 0
          fi
          git commit -q -m "Clean data and add reports (requested in #$PR)"
          git push -q
          { cat /tmp/summary.md; echo; echo "Clean data and reports were added to this PR (originals moved to data/raw/). Merge it to publish."; } > /tmp/body.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md

      # PR from a fork: the bot cannot push there, so it opens a copy with everything added
      - name: Open a copy of this PR with the results
        if: steps.pr.outputs.head_repo != github.repository
        working-directory: base
        run: |
          branch="bot/pr-$PR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch"
          git add data/clean data/raw reports
          git commit -q -m "Data from #$PR, cleaned, with reports"
          git push -q -f origin "$branch"
          { cat /tmp/summary.md; echo; echo "Data from #$PR, cleaned and with reports. Merge this PR to publish."; } > /tmp/body.md
          url=$(gh pr create --repo "$REPO" --head "$branch" --base "${{ steps.pr.outputs.base_ref }}" \
                --title "Data from #$PR with reports" --body-file /tmp/body.md 2>/dev/null \
                || gh pr view "$branch" --repo "$REPO" --json url --jq .url)
          gh pr comment "$PR" --repo "$REPO" --body "This PR comes from a fork, so the results were added to a copy: $url. Merge that one and close this PR."

# Data check: runs when a PR adds files to data/inbox/ or data/clean/.
# Inbox files are test-cleaned (nothing is written) and clean files are checked, so problems
# show up on the PR before a maintainer comments /report.
# Waits until a maintainer approves it (Required reviewers on the "pr-check" environment).
name: Check CSV

on:
  pull_request:
    paths:
      - "data/inbox/**"
      - "data/clean/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: pr-check   # waits for maintainer approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test-clean inbox files
        run: |
          node scripts/ingest.ts --check
          cat .ingest-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check clean files
        run: node scripts/validate.ts data/clean

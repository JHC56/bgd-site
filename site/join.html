<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F1">
<title>삐그덕 · 참여</title>
<meta name="description" content="인경호 정화 활동 참여와 조치·효과 기록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <section class="sect">
    <h1 class="section-title">조치하고, 다시 재고, 기록으로 남겨요</h1>
    <p class="section-lead">약제를 뿌리거나 장치를 설치했다면, 며칠 뒤 같은 자리에서 다시 잽니다. 효과가 숫자로 남아야 다음 예산과 정책을 설명할 수 있어요.</p>
    <div id="actions" style="margin-top:8px"></div>
  </section>

  <section class="grid2">
    <article class="card" id="event"></article>
    <article class="card">
      <div class="card__hd"><h2 class="card__title">학과별 참여</h2><span class="card__meta" id="deptyear"></span></div>
      <div class="rank" id="rank"></div>
    </article>
  </section>

  <section class="sect event">
    <div>
      <h2 class="section-title">냄새가 나거나 뭔가 떠 있나요?</h2>
      <p class="section-lead">본 위치와 시간을 알려 주세요. 오리 3호가 다음 순찰 때 그 지점을 먼저 확인합니다.</p>
    </div>
    <a class="btn" id="reportBtn" href="#">제보하기</a>
  </section>
</div>
<script type="module" src="assets/join.js"></script>
</body>
</html>

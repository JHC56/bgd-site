<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F1">
<title>삐그덕 · 수질 보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <div id="banner"></div>
  <section class="split">
    <aside class="card" aria-label="보고서 목록">
      <div class="card__hd"><h2 class="card__title">보고서</h2><span class="card__meta" id="count"></span></div>
      <div class="filters">
        <select id="fSite" aria-label="지점"><option value="">모든 지점</option></select>
        <select id="fStatus" aria-label="판정">
          <option value="">모든 판정</option><option value="good">적합</option><option value="warn">주의</option><option value="bad">부적합</option>
        </select>
      </div>
      <ul class="rlist" id="list"></ul>
    </aside>
    <article class="card" id="detail" aria-live="polite"><p class="empty">보고서를 선택하세요</p></article>
  </section>
</div>
<script type="module" src="assets/reports.js"></script>
</body>
</html>
